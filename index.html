<script>

let docType = "quote";

let routes = [];

let items = [];
let extraBanks = [];
let autoInvoiceDeadline = false;

// これまで発行した最後の番号。
// 初回だけこの番号を基準にして、以降はブラウザのlocalStorageで管理します。
const initialLastNumbers = {
  quote: 333,
  invoice: 408
};

function getNumberInfo() {
  const numberKey = docType === "quote"
    ? "311banchi_quote_number"
    : "311banchi_invoice_number";

  const numberPrefix = docType === "quote"
    ? "Q-"
    : "INV-";

  const stored = localStorage.getItem(numberKey);

  const parsedNumber = stored === null
    ? initialLastNumbers[docType]
    : (Number(stored) || 0);

  const lastNumber = Math.max(
    parsedNumber,
    initialLastNumbers[docType]
  );

  return {
    numberKey,
    numberPrefix,
    lastNumber,
    nextNumber: lastNumber + 1
  };
}

function setNextDocumentNumber() {
  const { numberPrefix, nextNumber } = getNumberInfo();

  document.getElementById("docNumber").value =
    numberPrefix + String(nextNumber).padStart(10, "0");
}

function getMonthEndDate(dateStr) {
  const base = dateStr
    ? new Date(dateStr + "T00:00:00")
    : new Date();

  if (Number.isNaN(base.getTime())) return "";

  const lastDay = new Date(
    base.getFullYear(),
    base.getMonth() + 1,
    0
  );

  const y = lastDay.getFullYear();
  const m = String(lastDay.getMonth() + 1).padStart(2, "0");
  const d = String(lastDay.getDate()).padStart(2, "0");

  return `${y}-${m}-${d}`;
}

function setInvoiceDeadlineFromDocDate() {
  if (docType !== "invoice") return;

  const docDate = document.getElementById("docDate").value;
  document.getElementById("deadline").value =
    getMonthEndDate(docDate);

  autoInvoiceDeadline = true;
}


const companyInfo = {

  name: "合同会社311BANCHI",

  zip: "〒133-0073",

  address: "東京都江戸川区鹿骨一丁目55番14号",

  building: "グラントールⅡ 204",

  tel: "携帯：090-9789-1376",

  mail: "mail：uqki7121@gmail.com",

  representative: "代表社員　屋比久悟",

  registration: "登録番号：T7011703003439"

};


const banks = {

  smbc: [

    "【三井住友銀行】トランクＮＯＲＴＨ支店（403）",

    "普通口座　0534099",

    "口座名義　ド）サンビャクジュウイチバンチ"

  ],

  gmo: [

    "【GMOあおぞらネット銀行】法人第二営業部支店（102）",

    "普通口座　1503182",

    "口座名義　ド）サンビャクジュウイチバンチ"

  ]

};


function setDocType(type) {

  if (docType === "invoice" && type === "quote" && autoInvoiceDeadline) {
    document.getElementById("deadline").value = "";
  }

  docType = type;

  document.getElementById("quoteBtn")
    .classList.toggle("active", type === "quote");

  document.getElementById("invoiceBtn")
    .classList.toggle("active", type === "invoice");

  if (type === "quote") {

    document.getElementById("dateLabel").textContent = "見積日";

    document.getElementById("deadlineLabel").textContent = "有効期限";

    autoInvoiceDeadline = false;

  } else {

    document.getElementById("dateLabel").textContent = "請求日";

    document.getElementById("deadlineLabel").textContent = "入金期日";

    setInvoiceDeadlineFromDocDate();

  }

  setNextDocumentNumber();

  updatePreview();

}


function addRoute(type) {

  const route = {

    type,
    date: document.getElementById("docDate").value || "",

    stops: type === "往路"

      ? [

          { kind: "搬出", no: 1, time: "", name: "", address: "" },

          { kind: "搬入", no: 1, time: "", name: "", address: "" }

        ]

      : [

          { kind: "搬出", no: 1, time: "", name: "", address: "" },

          { kind: "搬入", no: 1, time: "", name: "", address: "" }

        ]

  };

  routes.push(route);

  renderRoutes();

}

function renderRoutes() {

  const box = document.getElementById("routes");

  box.innerHTML = "";

  routes.forEach((route, routeIndex) => {

    const div = document.createElement("div");

    div.className = "route-box";

    div.innerHTML = `

      <div class="route-header">

        <div class="route-title">${route.type}</div>

        <button class="btn-danger" onclick="removeRoute(${routeIndex})">

          削除

        </button>

      </div>
<div class="route-date-row">
  <label>作業日</label>
  <input type="date"
    value="${escapeHtml(route.date || "")}"
    onchange="updateRouteDate(${routeIndex}, this.value)">
</div>
      <div id="routeStops${routeIndex}"></div>

      <div class="button-row">

        <button class="btn-sub" onclick="addStop(${routeIndex}, '搬出')">

          ＋ 搬出

        </button>

        <button class="btn-sub" onclick="addStop(${routeIndex}, '搬入')">

          ＋ 搬入

        </button>

      </div>

    `;

    box.appendChild(div);

    renderStops(routeIndex);

  });

}

function updateRouteDate(routeIndex, value) {

  if (!routes[routeIndex]) return;

  routes[routeIndex].date = value;

  updatePreview();

}
function renderStops(routeIndex) {

  const route = routes[routeIndex];

  const box = document.getElementById(`routeStops${routeIndex}`);

  box.innerHTML = "";

  route.stops.forEach((stop, stopIndex) => {

    const div = document.createElement("div");

    div.className = "stop";

    const label = `${stop.kind}${stop.no > 1 ? stop.no : ""}`;

    div.innerHTML = `

      <div class="stop-title">

        ${label}

      </div>

      <div class="row-3">

        <div class="field">

          <label>時刻</label>

          <input value="${escapeHtml(stop.time)}"

            onchange="updateStop(${routeIndex},${stopIndex},'time',this.value)">

        </div>

        <div class="field">

          <label>名称</label>

          <input value="${escapeHtml(stop.name)}"

            onchange="updateStop(${routeIndex},${stopIndex},'name',this.value)">

        </div>

        <div class="field">

          <label>住所</label>

          <input value="${escapeHtml(stop.address)}"

            onchange="updateStop(${routeIndex},${stopIndex},'address',this.value)">

        </div>

      </div>

      <button class="btn-danger"

        onclick="removeStop(${routeIndex},${stopIndex})">

        この行を削除

      </button>

    `;

    box.appendChild(div);

  });

}


function updateStop(routeIndex, stopIndex, key, value) {

  routes[routeIndex].stops[stopIndex][key] = value;

}


function addStop(routeIndex, kind) {

  const route = routes[routeIndex];

  const count = route.stops.filter(x => x.kind === kind).length + 1;

  route.stops.push({

    kind,

    no: count,

    time: "",

    name: "",

    address: ""

  });

  renumberStops(route);

  renderRoutes();

}


function removeStop(routeIndex, stopIndex) {

  routes[routeIndex].stops.splice(stopIndex, 1);

  renumberStops(routes[routeIndex]);

  renderRoutes();

}


function renumberStops(route) {

  const counts = {};

  route.stops.forEach(stop => {

    counts[stop.kind] = (counts[stop.kind] || 0) + 1;

    stop.no = counts[stop.kind];

  });

}


function removeRoute(index) {

  routes.splice(index, 1);

  renderRoutes();

}

function addExtraBank(value = "") {

  extraBanks.push(value);

  renderExtraBanks();

  updatePreview();

}


function renderExtraBanks() {

  const box = document.getElementById("extraBanks");

  if (!box) return;

  box.innerHTML = extraBanks.map((bank, index) => `

    <div class="field" style="margin-top:10px;">

      <label>追加振込先 ${index + 1}</label>

      <textarea
        rows="3"
        placeholder="銀行名・支店名・口座番号・口座名義など"
        oninput="updateExtraBank(${index}, this.value)"
      >${escapeHtml(bank)}</textarea>

      <button
        type="button"
        class="btn-danger"
        style="margin-top:5px;"
        onclick="removeExtraBank(${index})"
      >
        削除
      </button>

    </div>

  `).join("");

}


function updateExtraBank(index, value) {

  extraBanks[index] = value;

  updatePreview();

}


function removeExtraBank(index) {

  extraBanks.splice(index, 1);

  renderExtraBanks();

  updatePreview();

}
function addItem() {

  items.push({

    description: "",

    qty: 1,

    unit: 0

  });

  renderItems();

}


function renderItems() {

  const body = document.getElementById("itemsBody");

  body.innerHTML = "";

  items.forEach((item,index) => {

    const amount = Number(item.qty || 0) * Number(item.unit || 0);

    const tr = document.createElement("tr");

    tr.innerHTML = `

      <td>

        <input value="${escapeHtml(item.description)}"

          onchange="updateItem(${index},'description',this.value)">

      </td>

      <td>

        <input type="number" min="0" value="${item.qty}"

          onchange="updateItem(${index},'qty',this.value)">

      </td>

      <td>

        <input type="number" min="0" value="${item.unit}"

          onchange="updateItem(${index},'unit',this.value)">

      </td>

      <td class="text-right">

        ${yen(amount)}

      </td>

      <td>

        <button class="btn-danger"

          onclick="removeItem(${index})">

          削除

        </button>

      </td>

    `;

    body.appendChild(tr);

  });

  updatePreview();

}


function updateItem(index,key,value) {

  items[index][key] = key === "description"

    ? value

    : Number(value) || 0;

  renderItems();

}


function removeItem(index) {

  items.splice(index,1);

  renderItems();

}


function yen(value) {

  return Number(value || 0).toLocaleString("ja-JP") + "円";

}


function escapeHtml(value) {

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function getTotals() {

  const subtotal = items.reduce(

    (sum,item) =>

      sum + Number(item.qty || 0) * Number(item.unit || 0),

    0

  );

  const tax = Math.floor(subtotal * 0.10);

  return {

    subtotal,

    tax,

    total: subtotal + tax

  };

}


function routeToHtml(route) {

  if (!route.stops.length) {

    return "";

  }

  return route.stops.map((stop,index) => {

    const number = stop.no > 1 ? `①②③④⑤⑥⑦⑧⑨⑩`[stop.no-1] || stop.no : "";

    const label = stop.kind + number;

    return `

      <div class="detail-main">

        ${escapeHtml(label)}

        ${stop.time ? " " + escapeHtml(stop.time) : ""}

       　${escapeHtml(stop.name || "")}

      </div>

      <div class="detail-address">

        ${escapeHtml(stop.address || "")}

      </div>

    `;

  }).join("");

}


function buildRouteRows() {

  if (!routes.length) {

    return `

      <tr>

        <td colspan="6" style="text-align:center;padding:30px;">

          往路・復路を追加してください

        </td>

      </tr>

    `;

  }

  return routes.map(route => {

    const firstCharge = route.stops.length

      ? route.stops[0]

      : null;

    const detail = routeToHtml(route);

    const summaryHtml =
      route === routes[0]
        ? items
            .map(item => item.description?.trim())
            .filter(text => text)
            .map(text => `
              <div class="detail-summary">
                ${escapeHtml(text)}
              </div>
            `)
            .join("")
        : "";

    const routeDate = route.date
      ? formatDateShort(route.date)
      : "";

    return `

      <tr>

        <td class="date-col">

          ${escapeHtml(routeDate)}

        </td>

        <td class="type-col">

          ${escapeHtml(route.type)}

        </td>

        <td class="detail-col">

          ${detail}

          ${summaryHtml}

        </td>

        <td class="qty-col number">

          ${route.stops.length ? "1件" : ""}

        </td>

        <td class="unit-col number">

          ${route === routes[0] && items[0]

            ? yen(items[0].unit)

            : ""

          }

        </td>

        <td class="amount-col number">

          ${route === routes[0] && items[0]

            ? yen(items[0].qty * items[0].unit)

            : ""

          }

        </td>

      </tr>

    `;

  }).join("");

}


function formatDateShort(dateStr) {

  if (!dateStr) return "";

  const d = new Date(dateStr);

  if (Number.isNaN(d.getTime())) return dateStr;

 return `${d.getMonth()+1}/${d.getDate()}（${getWeekday(dateStr)}）`;

}

function getWeekday(dateStr) {

  if (!dateStr) return "";

  const d = new Date(dateStr);

  if (Number.isNaN(d.getTime())) return "";

  const days = ["日","月","火","水","木","金","土"];

  return days[d.getDay()];
}
function formatDateLong(dateStr) {

  if (!dateStr) return "";

  const d = new Date(dateStr);

  if (Number.isNaN(d.getTime())) return dateStr;

 return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${getWeekday(dateStr)}）`;
}

function getInvoiceLedger() {
  try {
    const saved =
      JSON.parse(localStorage.getItem("311banchi_invoice_ledger") || "[]");

    return Array.isArray(saved) ? saved : [];
  } catch (e) {
    return [];
  }
}

function saveInvoiceLedger(ledger) {
  localStorage.setItem(
    "311banchi_invoice_ledger",
    JSON.stringify(ledger)
  );
}

function registerCurrentInvoice() {
  if (docType !== "invoice") {
    alert("請求書に切り替えてから登録してください。");
    return;
  }

  const invoiceNumber =
    document.getElementById("docNumber").value.trim();

  const invoiceDate =
    document.getElementById("docDate").value;

  const customer =
    document.getElementById("customerCompany").value.trim();

  const subject =
    document.getElementById("subject").value.trim();

  const deadline =
    document.getElementById("deadline").value;

  const amount = getTotals().total;

  if (!invoiceNumber || !invoiceDate || !customer || !subject || !deadline) {
    alert("請求日・請求書番号・取引先・案件名・入金期日を入力してください。");
    return;
  }

  const ledger = getInvoiceLedger();

  const record = {
    invoiceNumber,
    invoiceDate,
    customer,
    subject,
    amount,
    deadline,
    freeeStatus: "未登録",
    paymentStatus: "未入金"
  };

  const existingIndex =
    ledger.findIndex(x => x.invoiceNumber === invoiceNumber);

  if (existingIndex >= 0) {
    record.freeeStatus =
      ledger[existingIndex].freeeStatus || "未登録";

    record.paymentStatus =
      ledger[existingIndex].paymentStatus || "未入金";

    ledger[existingIndex] = record;

    saveInvoiceLedger(ledger);
    showInvoiceLedger();
    alert("請求管理台帳を更新しました。");
    return;
  }

  ledger.unshift(record);

  saveInvoiceLedger(ledger);
  showInvoiceLedger();

  alert("請求管理台帳に登録しました。");
}

function showInvoiceLedger() {
  const body =
    document.getElementById("invoiceLedgerBody");

  if (!body) return;

  const ledger = getInvoiceLedger();

  if (!ledger.length) {
    body.innerHTML = `
      <tr>
        <td colspan="9" style="text-align:center;padding:20px;">
          まだ請求書が登録されていません。
        </td>
      </tr>
    `;
    return;
  }

  body.innerHTML = ledger.map((row, index) => `
    <tr>
      <td>${escapeHtml(row.invoiceNumber)}</td>
      <td>${escapeHtml(formatDateLong(row.invoiceDate))}</td>
      <td>${escapeHtml(row.customer)}</td>
      <td>${escapeHtml(row.subject)}</td>
      <td class="text-right">${yen(row.amount)}</td>
      <td>${escapeHtml(formatDateLong(row.deadline))}</td>
      <td>
        <select
          onchange="updateInvoiceLedgerStatus(${index}, 'freeeStatus', this.value)"
        >
          <option value="未登録" ${row.freeeStatus === "未登録" ? "selected" : ""}>未登録</option>
          <option value="登録済" ${row.freeeStatus === "登録済" ? "selected" : ""}>登録済</option>
        </select>
      </td>
      <td>
        <select
          onchange="updateInvoiceLedgerStatus(${index}, 'paymentStatus', this.value)"
        >
          <option value="未入金" ${row.paymentStatus === "未入金" ? "selected" : ""}>未入金</option>
          <option value="入金済" ${row.paymentStatus === "入金済" ? "selected" : ""}>入金済</option>
        </select>
      </td>
      <td>
        <button class="btn-danger" onclick="deleteInvoiceLedger(${index})">
          削除
        </button>
      </td>
    </tr>
  `).join("");
}

function updateInvoiceLedgerStatus(index, key, value) {
  const ledger = getInvoiceLedger();

  if (!ledger[index]) return;

  if (key !== "freeeStatus" && key !== "paymentStatus") return;

  ledger[index][key] = value;

  saveInvoiceLedger(ledger);
  showInvoiceLedger();
}

function deleteInvoiceLedger(index) {
  const ledger = getInvoiceLedger();

  if (!ledger[index]) return;

  if (!confirm(
    `請求書 ${ledger[index].invoiceNumber} を台帳から削除しますか？`
  )) {
    return;
  }

  ledger.splice(index, 1);

  saveInvoiceLedger(ledger);
  showInvoiceLedger();
}

function printAndAdvance() {

  const { numberKey, nextNumber } = getNumberInfo();

  const enteredNumber =
    Number(
      (document.getElementById("docNumber").value || "")
        .replace(/\D/g, "")
    );

  const issuedNumber = Math.max(
    enteredNumber || nextNumber,
    initialLastNumbers[docType]
  );

  localStorage.setItem(numberKey, String(issuedNumber));

  window.print();

  // 印刷ダイアログを閉じたら次の番号を表示

  updatePreview();
}
